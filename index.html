<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get in Touch</title>

<style>
  :root {
    --primary: #2C6192;
    --primary-dark: #234E77;
    --primary-ring: rgba(44, 97, 146, 0.18);
    --text: #2B2B2B;
    --white: #FFFFFF;
    --radius: 8px;
    --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .landing { text-align: center; width: 100%; max-width: 560px; }

  h1 {
    margin: 0 0 32px;
    font-size: 32px;
    font-weight: 600;
    color: var(--primary);
  }

  .actions {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 24px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    color: var(--white);
    background: var(--primary);
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--primary-ring); }

  .btn-outline { color: var(--primary); background: var(--white); }
  .btn-outline:hover { color: var(--white); background: var(--primary); border-color: var(--primary); }

  @media (max-width: 480px) {
    .actions { flex-direction: column; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<main class="landing">
  <h1>How can we help you?</h1>
  <div class="actions">
    <a class="btn" href="webTocase2.html">Contact Us</a>
    <a class="btn btn-outline" href="webTocase3.html">Contact with Chairman</a>
  </div>
</main>

</body>
</html>
